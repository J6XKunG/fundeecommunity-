<style>
:root{color-scheme:light;
 --bg:#fdfbf6;--panel:#ffffff;--item:#ffffff;--soft:#f6efde;--soft2:#ecdcae;--tx:#111111;--mut:#6a604c;--line:#eadfc4;--gold:#b8923a;
 --btn:#c9a24b;--btntx:#111111;--h:#111111;--acc:#b8923a;--inp:#ffffff;--sh:#b8923a22;--err:#b3202a;--ok:#2e7d4f;
 --glow:radial-gradient(60% 38% at 50% 0,#f3e4b8 0,transparent 72%)}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#141414;--panel:#1a1a1a;--item:#1b1b1b;--soft:#262626;--soft2:#333333;--tx:#ffffff;--mut:#b4b4b4;--line:#303030;--gold:#e03039;
 --btn:#c4161c;--btntx:#ffffff;--h:#ffffff;--acc:#e03039;--inp:#101010;--sh:#ffffff14;--err:#ff8f8f;--ok:#a5e6a5;
 --glow:radial-gradient(60% 38% at 50% 0,#2c2c2c 0,transparent 72%)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--glow) no-repeat,var(--bg);background-color:var(--bg);color:var(--tx);font:400 15px/1.7 Prompt,"Noto Sans SC",system-ui,sans-serif;min-height:100vh;padding:24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:8px 0}
header{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
#mark{width:auto;height:48px;cursor:pointer;user-select:none;-webkit-user-drag:none;border:0;background:none;padding:0}
#mark img{height:100%;display:block}
header h1{font:600 18px/1.2 Prompt,"Noto Sans SC",sans-serif;color:var(--h);letter-spacing:.12em}
header small{display:block;color:var(--mut);font-size:13px;font-weight:300}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
#langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;gap:2px}
#langs button{border:0;background:none;color:var(--mut);padding:4px 11px;border-radius:99px;font-size:13px;font-weight:500;transition:background .2s,color .2s}
#langs button:hover{color:var(--tx)}
#langs button[aria-pressed=true]{background:var(--btn);color:var(--btntx)}
#theme{background:transparent;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:17px;transition:border-color .2s,background .2s}
#theme:hover{border-color:var(--acc);background:var(--soft)}
.btn{display:inline-block;border:1px solid transparent;border-radius:8px;padding:10px 22px;font-weight:500;text-decoration:none;background:var(--btn);color:var(--btntx);transition:transform .15s,filter .2s,background .2s,border-color .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.soft{background:transparent;color:var(--tx);border-color:var(--line)}
.btn.soft:hover{border-color:var(--acc);background:var(--soft);filter:none}
.sm{padding:6px 14px;font-size:13px}
main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;margin-top:28px}
#view{grid-column:2;grid-row:1;min-height:55vh}
.side{grid-column:1;grid-row:1;position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:12px;border:0;border-radius:8px;padding:11px 14px;text-align:left;background:none;color:var(--mut);font-weight:400;transition:background .2s,color .2s}
.side button:hover{background:var(--soft);color:var(--tx)}
.side button[aria-selected=true]{background:var(--soft);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
h2{font:600 clamp(24px,4vw,30px)/1.3 Prompt,"Noto Sans SC",sans-serif;color:var(--h);margin-bottom:6px}
h2::after{content:"";display:block;width:36px;height:3px;border-radius:2px;margin-top:10px;background:var(--acc)}
.lead{color:var(--mut);margin:14px 0 22px;max-width:56ch;font-weight:300}
.hero{display:block;width:min(100%,600px);margin:0 auto 10px}
#view .home{text-align:center}.home .lead{margin-inline:auto}.home .row{justify-content:center}
.card{background:var(--item);border:1px solid var(--line);border-radius:14px;padding:22px;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--acc)}
.card h3{font:600 17px/1.4 Prompt,"Noto Sans SC",sans-serif;color:var(--h)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
.grid .card{display:flex;flex-direction:column;gap:8px}
.nmeta{font-size:13px;color:var(--mut)}.nbody{white-space:pre-line;overflow-wrap:anywhere;font-weight:300}
.empty{color:var(--mut);text-align:center;border:1px dashed var(--line);border-radius:14px;padding:34px;margin-top:20px}
.pq{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:600 22px Prompt,"Noto Sans SC",sans-serif;background:var(--soft);color:var(--acc);border:1px solid var(--line);align-self:center}
.pcard{text-align:center;align-items:center}
.badge{font-size:11px;font-weight:500;padding:2px 12px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);background:transparent}
.foot{font-size:12px;color:var(--mut);margin-top:40px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input,textarea{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
input:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{height:90px;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.msg{color:var(--err);font-size:14px;min-height:22px;margin-top:8px}
dialog{margin:auto;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(760px,96vw);max-height:90dvh}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#000a;backdrop-filter:blur(6px)}
dialog h3{font:600 20px Prompt,"Noto Sans SC",sans-serif;color:var(--h)}
#lock{width:min(380px,94vw)}
#ab{flex:1;overflow:auto;padding:2px 4px}#ab h4{margin:22px 0 10px;color:var(--acc);font-weight:600}
.ar{background:var(--item);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
code{font:12px ui-monospace,monospace;background:var(--soft);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.burst{position:fixed;z-index:120;pointer-events:none;font-size:20px;animation:burst .85s ease-out forwards}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) rotate(var(--br)) scale(.4);opacity:0}}
/* ===== Loading ===== */
body.loading{overflow:hidden}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;text-align:center;background:var(--glow) no-repeat,var(--bg);transition:opacity .7s ease,visibility .7s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .box{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(320px,100%)}
#loader .ring{display:grid;place-items:center;width:112px;height:112px;border-radius:50%;border:1px solid var(--acc);box-shadow:0 0 44px var(--sh);animation:glow 2.4s ease-in-out infinite}
#loader .ring img{height:58px;width:auto;display:block}
#loader h1{font:600 20px/1.2 Prompt,"Noto Sans SC",sans-serif;color:var(--h);letter-spacing:.16em}
#loader .bar{width:100%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s ease-out}
#loader .st{font-size:13px;color:var(--mut);min-height:22px}
#loader .go{display:none;flex-direction:column;align-items:center;gap:10px}
#loader.ready .go{display:flex}
#loader.ready .bar,#loader.ready .st{display:none}
#loader .go .btn{min-width:220px;font-size:16px}
#loader .ring{position:relative;animation:loaderPulse 2s ease-in-out infinite}
#loader .ring:before,#loader .ring:after{content:"";position:absolute;inset:-9px;border:1px solid color-mix(in srgb,var(--acc) 42%,transparent);border-radius:50%;animation:loaderOrbit 3.2s linear infinite}
#loader .ring:after{inset:-18px;opacity:.35;animation-duration:5s;animation-direction:reverse}
#loader .ring img{position:relative;z-index:1;animation:logoFloat 2.4s ease-in-out infinite}
#loader .orbit{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--acc);top:-5px;left:50%;box-shadow:0 0 14px var(--acc);animation:loaderOrbit 2.4s linear infinite}
#loader .count{font:700 clamp(28px,8vw,38px)/1 Prompt,"Noto Sans SC",sans-serif;letter-spacing:.06em;color:var(--h);font-variant-numeric:tabular-nums;text-shadow:0 0 22px var(--sh);animation:numberIn .25s ease}
#loader .bar{height:5px;position:relative;box-shadow:0 0 16px var(--sh)}
#loader .bar i{position:relative;overflow:hidden;box-shadow:0 0 12px var(--acc)}
#loader .bar i:after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:barShine 1.1s linear infinite}
#loader .st{letter-spacing:.12em;animation:statusFade 1.8s ease-in-out infinite}
#loader.ready .go{animation:numberIn .45s ease both}
#loader.ready:not(.audio-blocked) .go{display:none}
@keyframes loaderPulse{0%,100%{transform:scale(.96);box-shadow:0 0 24px var(--sh)}50%{transform:scale(1.04);box-shadow:0 0 54px var(--sh)}}
@keyframes loaderOrbit{to{transform:rotate(360deg)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}
@keyframes barShine{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
@keyframes statusFade{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes numberIn{from{opacity:.35;transform:translateY(5px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{50%{box-shadow:0 0 64px var(--sh)}}
@media(prefers-reduced-motion:reduce){.burst{display:none}.btn,#loader,#loader .bar i{transition:none}#loader .ring{animation:none}html{scroll-behavior:auto}}
@media(max-width:560px){header{gap:10px}header small{display:none}header h1{font-size:15px;letter-spacing:.06em}#mark{height:38px}#langs button{padding:4px 8px;font-size:12px}}
@media(max-width:760px){body{padding:14px}main{grid-template-columns:1fr;gap:18px;margin-top:20px}
 #view,.side{grid-column:1}.side{grid-row:1;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;gap:4px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
 #view{grid-row:2}
 .side button{white-space:nowrap;padding:9px 14px}.side button[aria-selected=true]{box-shadow:inset 0 -3px 0 var(--acc)}}

/* News image upload + zoom viewer */
.news-photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin:2px 0 8px;border:1px solid var(--line);cursor:zoom-in;transition:filter .2s}.news-photo:hover{filter:brightness(1.06)}
.photo-open{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;cursor:zoom-in}
.photo-toolbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#photo-view{width:min(1100px,96vw);height:min(92dvh,900px);padding:14px;overflow:hidden}
.photo-stage{width:100%;height:calc(100% - 82px);min-height:180px;overflow:auto;display:flex;align-items:center;justify-content:center;background:#08090dcc;border-radius:10px;touch-action:pan-x pan-y}
#photo-large{display:block;max-width:100%;max-height:100%;object-fit:contain;transform:scale(1);transform-origin:center center;transition:transform .12s ease;user-select:none;-webkit-user-drag:none}
.photo-hint{text-align:center;margin:8px 0 0}.ar .image-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ar input[type=file]{padding:8px;font-size:13px;max-width:100%}.ar .admin-thumb{width:100px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
@media(max-width:560px){#photo-view{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;padding:10px}.photo-stage{height:calc(100% - 90px)}}
.partner-open{width:100%;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0}
.partner-avatar{width:100%;max-width:220px;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.partner-avatar.fallback{display:grid;place-items:center;aspect-ratio:1;width:72px;font-size:28px}
#partner-view{width:min(560px,94vw);max-height:88vh;overflow:auto}
.partner-detail-photo{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--soft);margin:12px 0}
.partner-detail-text{white-space:pre-line;overflow-wrap:anywhere;color:var(--tx);line-height:1.75}
.partner-detail-label{font-size:12px;color:var(--mut);margin:16px 0 4px}
@media(max-width:560px){#partner-view{width:100vw;max-height:100dvh;height:100dvh;border-radius:0}}
/* Bottom-right notification: long horizontal rounded toast */
#toast-stack{position:fixed;right:22px;bottom:22px;z-index:99999;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;max-width:min(420px,calc(100vw - 28px))}
.toast{width:max-content;max-width:100%;min-width:min(300px,calc(100vw - 28px));min-height:58px;box-sizing:border-box;display:flex;align-items:center;gap:13px;padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);box-shadow:0 12px 36px #0003;backdrop-filter:blur(14px);font-size:14px;line-height:1.45;pointer-events:auto;animation:toastIn .28s cubic-bezier(.2,.8,.2,1) both}
.toast .ti{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:var(--soft);font-size:17px}
.toast .tt{display:flex;flex-direction:column;gap:2px}.toast strong{font-size:13px}.toast small{font-size:12px;color:var(--mut)}
.toast.success .ti{background:#16a34a1c}.toast.error .ti{background:#dc26261c}.toast.info .ti{background:#3b82f61c}
.toast.out{animation:toastOut .22s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translate(18px,12px) scale(.97)}to{opacity:1;transform:translate(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
@media(max-width:560px){#toast-stack{right:12px;bottom:12px;left:12px;align-items:stretch}.toast{width:100%;min-width:0}}

(()=>{const C=document.getElementById("clk");let mute=false,clickConfigured=false;C.volume=.6;const configureClick=async()=>{if(clickConfigured)return;try{let cfg={};try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok)cfg=await r.json()}catch(e){}try{cfg={...cfg,...JSON.parse(localStorage.getItem("fundee-data")||"{}")}}catch(e){}if(cfg.audioClick===false){mute=true;clickConfigured=true;return}if(typeof cfg.audioClick==="string"&&cfg.audioClick.startsWith("data:audio/"))C.src=cfg.audioClick;clickConfigured=true;}catch(e){clickConfigured=true;}};configureClick();
document.getElementById("lmute").addEventListener("click",()=>{mute=true});
document.addEventListener("click",e=>{
 if(mute||e.target.closest("#loader,#mark"))return;
 if(!e.target.closest(".side button,.btn,#theme,#langs button"))return;
 try{if(!clickConfigured)return;C.currentTime=0;const r=C.play();if(r&&r.catch)r.catch(()=>{})}catch(x){}
},true);
})();
</script>
</body>
</html>
